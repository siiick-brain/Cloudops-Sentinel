global:
  resolve_timeout: 5m

route:
  receiver: sentinel
  group_by: [alertname, service, severity]
  group_wait: 20s
  group_interval: 2m
  repeat_interval: 4h
  routes:
    - matchers: [maintenance="true"]
      receiver: sentinel
      mute_time_intervals: [scheduled-maintenance]
    - matchers: [severity="critical"]
      receiver: sentinel-critical
      routes:
        - matchers: [service=~"api|inventory|node|container"]
          receiver: sentinel-critical
        - matchers: [service=~"monitoring|prometheus|alertmanager"]
          receiver: sentinel-critical
    - matchers: [severity="warning"]
      receiver: sentinel-warning
      routes:
        - matchers: [service=~"api|inventory|node|container"]
          receiver: sentinel-warning
        - matchers: [service=~"monitoring|prometheus|alertmanager"]
          receiver: sentinel-warning

time_intervals:
  - name: scheduled-maintenance
    time_intervals:
      - weekdays: [sunday]
        times:
          - start_time: "02:00"
            end_time: "03:00"
        location: UTC

inhibit_rules:
  - source_matchers: [alertname="NodeDown", service="node"]
    target_matchers: [service=~"api|inventory"]
    equal: []

receivers:
  - name: sentinel
    webhook_configs:
      - url: http://alert-router:8090/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/router_shared_token
  - name: sentinel-critical
    webhook_configs:
      - url: http://alert-router:8090/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/router_shared_token
  - name: sentinel-warning
    webhook_configs:
      - url: http://alert-router:8090/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/router_shared_token
