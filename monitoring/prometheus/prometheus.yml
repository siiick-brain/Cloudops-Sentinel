global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    monitor: cloudops-sentinel

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/platform.yml
  - /etc/prometheus/rules/slo.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["prometheus:9090"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
  - job_name: api
    metrics_path: /metrics
    static_configs: [{targets: ["api:8000"]}]
  - job_name: backend
    metrics_path: /metrics
    static_configs: [{targets: ["backend:8001"]}]
  - job_name: alert-router
    metrics_path: /metrics
    static_configs: [{targets: ["alert-router:8090"]}]
  - job_name: mock-jira
    metrics_path: /metrics
    static_configs: [{targets: ["mock-jira:8080"]}]
  - job_name: mock-slack
    metrics_path: /metrics
    static_configs: [{targets: ["mock-slack:8080"]}]
  - job_name: grafana
    metrics_path: /metrics
    static_configs: [{targets: ["grafana:3000"]}]
  - job_name: tempo
    metrics_path: /metrics
    static_configs: [{targets: ["tempo:3200"]}]
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs: [{targets: ["otel-collector:8888"]}]
  - job_name: otel-spanmetrics
    metrics_path: /metrics
    static_configs: [{targets: ["otel-collector:9464"]}]
  - job_name: node-exporter
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: cadvisor
    metrics_path: /metrics
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: docker-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["docker-exporter:9713"]

