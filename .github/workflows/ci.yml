name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest
      - name: Run Ruff
        run: ruff check .
      - name: Run Mypy
        run: mypy
      - name: Run YAML lint
        run: yamllint -c yamllint.yml .
      - name: Check style rules
        shell: pwsh
        run: ./scripts/check-style.ps1
      - name: Check Compose configuration
        run: docker compose config --quiet
      - name: Check dashboard generation drift
        run: |
          python scripts/generate_dashboards.py
          python scripts/generate_slo_rules.py
          git diff --exit-code -- monitoring/grafana/dashboards monitoring/prometheus/rules/slo.yml
      - name: Check Prometheus rules
        run: |
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.3.0 check rules \
            /etc/prometheus/rules/slo.yml /etc/prometheus/rules/platform.yml
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.3.0 test rules /etc/prometheus/rules/slo.test.yml
      - name: Check Alertmanager configuration and routes
        run: |
          docker run --rm --entrypoint=/bin/amtool \
            -v "$PWD/monitoring/alertmanager.yml:/etc/alertmanager/config.yml:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/config.yml
          docker run --rm --entrypoint=/bin/amtool \
            -v "$PWD/monitoring/alertmanager.yml:/etc/alertmanager/config.yml:ro" \
            prom/alertmanager:v0.28.1 config routes test \
            --config.file=/etc/alertmanager/config.yml \
            --verify.receivers=sentinel-critical \
            alertname=Smoke severity=critical service=api
      - name: Check secret history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 dir /repo --redact
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 git /repo --log-opts=--all --redact
      - name: Build images for Trivy
        run: docker compose build api backend alert-router mock-jira mock-slack
      - name: Scan service images
        run: |
          for image in cloudops-sentinel-api cloudops-sentinel-backend cloudops-sentinel-alert-router cloudops-sentinel-mock-jira cloudops-sentinel-mock-slack; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.59.1 image --exit-code 1 --severity CRITICAL,HIGH "$image"
          done
  authorship-and-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Check writing style
        shell: pwsh
        run: ./scripts/check-style.ps1
      - name: Check public text and authorship
        run: python scripts/check_public_terms.py

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INTEGRATION_MODE: mock
      GRAFANA_ADMIN_PASSWORD: ci-only-test-password
      ROUTER_SHARED_TOKEN: ci-only-router-token
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate production Compose configuration
        run: docker compose -f compose.prod.yml config --quiet
      - name: Start local production-style deployment
        run: docker compose -p cloudops-sentinel-prod -f compose.prod.yml up -d --build
      - name: Verify the deployment through Caddy
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --insecure --tlsv1.3 --tls-max 1.3 \
              --output /dev/null https://localhost/; then
              break
            fi
            sleep 2
          done
          bash scripts/verify-deployment.sh
      - name: Verify internal service and container metrics
        run: |
          docker compose -p cloudops-sentinel-prod -f compose.prod.yml exec -T api \
            python -c "import urllib.request; response=urllib.request.urlopen('http://127.0.0.1:8000/orders/ci-check', timeout=10); assert response.status == 200"
          docker compose -p cloudops-sentinel-prod -f compose.prod.yml exec -T api \
            python -c '
          import requests
          body = requests.get("http://cadvisor:8080/metrics", timeout=10).text
          samples = body.splitlines()
          assert any(line.startswith("container_cpu_usage_seconds_total{") and "name=" in line and "cloudops-sentinel-prod-api" in line for line in samples)
          assert any(line.startswith("container_memory_working_set_bytes{") and "name=" in line and "cloudops-sentinel-prod-api" in line for line in samples)
          '
      - name: Stop local production-style deployment
        if: always()
        run: docker compose -p cloudops-sentinel-prod -f compose.prod.yml down -v
